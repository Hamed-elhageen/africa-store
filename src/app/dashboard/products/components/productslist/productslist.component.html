<div class="container p-4 md:p-6">
    <!-- Header + Filters -->
    <div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-center sm:justify-between">
        <!-- Title -->
        <h2 class="text-xl font-semibold text-white">Products List</h2>
        <div class="flex items-center w-full md:w-[400px] max-w-md px-3 py-3 text-black bg-white rounded-3xl">
            <i class="mr-2 text-gray-500 fa-solid fa-search"></i>
                <input type="text" (input)="onSearch($event)" placeholder="Search products ..." class="flex-1 text-sm bg-transparent outline-none"/>
        </div>

        <!-- Right Section (Filters + Button) -->
        <div class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-center sm:gap-4">
            <!-- Filter Dropdown -->
            <select
            (change)="onCategoryChange($event)"
                class="px-4 py-2 text-sm text-white bg-gray-800 border border-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-green-600">
                <option value="">All categories</option>
                @for (category of categories; track $index) {
                <option [value]="category._id">{{category.name}}</option>
                }
            </select>



            <!-- Add Product Button -->
            <button
            routerLink="/dashboard/products/addproduct"
                class="flex items-center gap-2 px-4 py-2 text-white transition bg-green-600 rounded-md hover:bg-green-700">
                <i class="fa-solid fa-plus"></i>
                <span>Add Product</span>
            </button>
        </div>
    </div>

    <!-- Table for Desktop -->
    <div class="hidden overflow-x-auto rounded-lg shadow md:block">
        <table class="min-w-full text-sm text-left text-gray-300 border border-gray-700 bg-slate-950">
            <thead class="text-gray-400 bg-gray-900">
                <tr>
                    <th class="px-6 py-3">#</th>
                    <th class="px-6 py-3">Image</th>
                    <th class="px-6 py-3">Name</th>
                    <th class="px-6 py-3">Category</th>
                    <th class="px-6 py-3">Price</th>
                    <th class="px-6 py-3">Stock</th>
                    <th class="px-6 py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let product of products; let i = index"
                    class="border-t border-gray-700 hover:bg-gray-800">
                    <td class="px-6 py-4">{{ i + 1 }}</td>
                    <td class="px-6 py-4">
                        <img [src]="product.thumbnail.secure_url" alt="product" class="object-cover w-12 h-12 rounded-md" />
                    </td>
                    <td class="px-6 py-4">{{ product.name}}</td>
                    <td class="px-6 py-4">{{ product.category?.name }}</td>
                    <td class="px-6 py-4">${{ product.finalPrice }}</td>
                    <td class="px-6 py-4">{{ product.stock }}</td>
                    <td class="flex justify-center gap-2 px-6 py-4">
                        <button
                        [routerLink]="['/dashboard/products/editproduct/',product._id]"
                            class="px-3 py-1 text-sm text-white transition bg-blue-600 rounded hover:bg-blue-700">

                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button
                        (click)="deleteProduct(product._id)"
                            class="px-3 py-1 text-sm text-white transition bg-red-600 rounded hover:bg-red-700">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Cards for Mobile -->
    <div class="grid gap-4 md:hidden">
        <div *ngFor="let product of products" class="p-4 bg-gray-900 border border-gray-700 rounded-lg shadow">
            <div class="flex items-center gap-4">
                <img [src]="product.image" alt="product" class="object-cover w-16 h-16 rounded-md" />
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-white">{{ product.name }}</h3>
                    <p class="text-sm text-gray-400">{{ product.category }}</p>
                </div>
            </div>
            <div class="flex items-center justify-between mt-4 text-gray-300">
                <span>${{ product.price }}</span>
                <span class="text-sm">Stock: {{ product.stock }}</span>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button
                    class="px-3 py-1 text-sm text-white transition bg-blue-600 rounded hover:bg-blue-700">
                    <i class="fa-solid fa-pen"></i>
                </button>
                <button
                    class="px-3 py-1 text-sm text-white transition bg-red-600 rounded hover:bg-red-700">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        </div>
    </div>
</div>
