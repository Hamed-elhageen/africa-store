<div class="max-w-5xl p-6 mx-auto bg-gray-900 rounded-lg shadow-lg">
    <h2 class="mb-6 text-2xl font-bold text-white">Add New Product</h2>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Product Name -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Product Name</label>
            <input type="text" formControlName="name"
                   class="w-full px-4 py-2 text-white bg-gray-800 border border-gray-600 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
        </div>

        <!-- Category -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Category</label>
            <select formControlName="categoryId"
                    class="w-full px-4 py-2 text-white bg-gray-800 border border-gray-600 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                <option value="" disabled>Select Category</option>
                <option *ngFor="let category of categories" [value]="category.id">
                    {{ category.name }}
                </option>
            </select>
        </div>

        <!-- Team -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Team</label>
            <select formControlName="teamId"
                    class="w-full px-4 py-2 text-white bg-gray-800 border border-gray-600 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
                <option value="" disabled>Select Team</option>
                <option *ngFor="let team of teams" [value]="team.id">
                    {{ team.name }}
                </option>
            </select>
        </div>

        <!-- Sizes -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Available Sizes</label>
            <div class="flex flex-wrap gap-4">
                <label *ngFor="let size of allSizes" class="flex items-center gap-2 text-gray-300">
                    <input type="checkbox"
                           [value]="size"
                           (change)="onSizeChange($event)"
                           [checked]="selectedSizes.includes(size)"
                           class="w-4 h-4 text-green-600 bg-gray-800 border-gray-600 rounded focus:ring-green-500">
                    <span>{{ size }}</span>
                </label>
            </div>
        </div>

        <!-- Images -->
        <div class="grid gap-4 md:grid-cols-3">
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">First Image</label>
                <input type="file" (change)="onFileChange($event, 'image1')" accept="image/*"
                       class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Second Image</label>
                <input type="file" (change)="onFileChange($event, 'image2')" accept="image/*"
                       class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Third Image</label>
                <input type="file" (change)="onFileChange($event, 'image3')" accept="image/*"
                       class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-600 file:text-white hover:file:bg-green-700">
            </div>
        </div>

        <!-- Pricing -->
        <div class="grid gap-6 md:grid-cols-3">
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Price Before Discount</label>
                <input type="number" formControlName="priceBeforeDiscount"
                       class="w-full px-4 py-2 text-white bg-gray-800 border border-gray-600 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Discount (%)</label>
                <input type="number" formControlName="discount"
                       class="w-full px-4 py-2 text-white bg-gray-800 border border-gray-600 rounded-md focus:ring-2 focus:ring-green-500 focus:outline-none">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Price After Discount</label>
                <input type="number" formControlName="priceAfterDiscount" 
                       class="w-full px-4 py-2 text-white bg-gray-700 border border-gray-600 rounded-md cursor-not-allowed">
            </div>
        </div>

        <!-- Submit -->
        <div class="flex justify-end">
            <button type="submit" [disabled]="productForm.invalid"
                    class="px-6 py-2 font-medium text-white transition bg-green-600 rounded-md hover:bg-green-700 disabled:opacity-50">
                Save Product
            </button>
        </div>
    </form>
</div>
