<div class="max-w-3xl p-6 mx-auto border-gray-700 rounded-lg shadow-lg bg-slate-950">
    <!-- Title -->
    <h2 class="mb-6 text-2xl font-bold text-white">Add New Category</h2>

    <!-- Form -->
    <form [formGroup]="categoryForm" (ngSubmit)="addCategory()"  class="space-y-6">
        <!-- Category Name -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Category Name</label>
            <input type="text"
                formControlName="name"
                placeholder="Enter category name"
                class="w-full px-4 py-2 text-white placeholder-gray-500 bg-gray-800 border border-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <div *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid" class="mt-1 text-sm text-red-500">
                Category name is required (min 2 characters).
            </div>
        </div>


        <!-- Category Image -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Category Image</label>
            @if(imagePreview){<img    [src]="imagePreview "   alt="Category Preview" class="object-cover w-32 h-32 mb-5 rounded-md shadow-md">}
            <input type="file"
                formControlName="image"
                (change)="onFileChange($event)"

                accept="image/*"
                class="block w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700">
            <div *ngIf="categoryForm.get('image')?.touched && categoryForm.get('image')?.invalid" class="mt-1 text-sm text-red-500">
                Category image is required.
            </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button type="submit"
                    class="px-6 py-2 text-white transition bg-green-600 rounded-md hover:bg-green-700">
                <i class="mr-2 fa-solid fa-plus"></i>
                Add Category
            </button>
        </div>
    </form>
</div>
