<div class="max-w-6xl p-6 mx-auto bg-gray-900 rounded-lg shadow-lg">
    <!-- Header -->
    <div class="flex flex-col items-center justify-between gap-4 mb-6 sm:flex-row">
        <h2 class="text-2xl font-bold text-white">Categories</h2>

        <div class="flex items-center w-full gap-3 sm:w-auto">
            <!-- Add Category -->
            <button routerLink="/dashboard/categories/addcategory" class="px-4 py-2 text-sm font-medium text-white transition bg-green-600 rounded-md hover:bg-green-700">
                + Add Category
            </button>
        </div>
    </div>

    <!-- Table for Desktop -->
    <div class="hidden overflow-x-auto rounded-lg shadow md:block">
        <table class="min-w-full text-sm text-left text-gray-300 border border-gray-700 rounded-md bg-slate-950">
            <thead class="text-xs text-gray-400 uppercase bg-gray-800">
                <tr>
                    <th class="px-6 py-3">Image</th>
                    <th class="px-6 py-3">ID</th>
                    <th class="px-6 py-3">Name</th>
                    <th class="px-6 py-3">Products</th>
                    <th class="px-6 py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let category of allcategories" class="border-b border-gray-700 hover:bg-gray-800/70">
                    <td class="px-6 py-3">
                        <img [src]="category.image.secure_url"
                             alt="{{ category.name }}"
                             class="object-cover w-12 h-12 border border-gray-600 rounded-md">
                    </td>
                    <td class="px-6 py-3">{{ category._id }}</td>
                    <td class="px-6 py-3 font-medium">{{ category.name }}</td>
                    <td class="px-6 py-3 text-white">{{category.productsCount}}</td>
                    <td class="px-6 py-3 text-center">
                        <button [routerLink]="['/dashboard/categories/editcategory',category._id]" class="px-3 py-1 mr-2 text-sm text-white bg-blue-600 rounded-md hover:bg-blue-700">
                            Edit
                        </button>
                        <button (click)="deleteService(category._id)" class="px-3 py-1 text-sm text-white bg-red-600 rounded-md hover:bg-red-700">
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Cards for Mobile -->
    <div class="grid gap-4 md:hidden">
        <div *ngFor="let category of allcategories"
             class="p-4 bg-gray-800 border border-gray-700 rounded-lg shadow">
            <div class="flex items-center gap-4">
                <img [src]="category.image.secure_url"
                     alt="{{ category.name }}"
                     class="object-cover w-16 h-16 border border-gray-600 rounded-md">
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-white">{{ category.name }}</h3>
                    <!-- <p class="text-sm text-gray-400">{{ category.productsCount }} Products</p> -->
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button class="px-3 py-1 text-sm text-white bg-blue-600 rounded hover:bg-blue-700">
                    Edit
                </button>
                <button  (click)="deleteService(category._id)"  class="px-3 py-1 text-sm text-white bg-red-600 rounded hover:bg-red-700">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>
