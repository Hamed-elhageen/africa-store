<div class="container p-4 md:p-6">
        <!-- Title -->
        <div class="flex items-center justify-between mb-5">
<h2 class="mb-4 text-xl font-semibold text-white">Orders List</h2>

        </div>


    <!-- Table for Desktop -->
    <div class="hidden overflow-x-auto rounded-lg shadow md:block">
        <table class="min-w-full text-sm text-left text-gray-300 border border-gray-700 bg-slate-950">
            <thead class="text-gray-400 bg-gray-900">
                <tr>
                    <th class="px-6 py-3">#</th>
                    <th class="px-6 py-3">User Name</th>
                    <th class="px-6 py-3">Phone</th>
                    <th class="px-6 py-3">Address</th>
                    <th class="px-6 py-3">Price</th>
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3 text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let order of orders; let i = index" [ngClass]="{'bg-green-800':order.orderStatus=='completed','hover:bg-green-700':order.orderStatus=='completed' , 'bg-red-900':order.orderStatus==='cancelled', 'hover:bg-red-800':order.orderStatus==='cancelled' , 'bg-slate-950':order.orderStatus==='pending','hover:bg-slate-800':order.orderStatus==='pending'}"
                    class="transition-all duration-100 border-t border-gray-700 hover:bg-geen-700">
                    <td class="px-6 py-4">{{ i + 1 }}</td>
                    <td class="px-6 py-4">{{ order.username}}</td>
                    <td class="px-6 py-4">{{ order.phone }}</td>
                    <td class="px-6 py-4">${{ order.address }}</td>
                    <td class="px-6 py-4">{{ order.price }}</td>
                    <td class="px-6 py-4">{{ order.createdAt }}</td>
                    <td class="flex justify-center gap-2 px-6 py-4">
                        <button
                        [routerLink]="['/dashboard/orders/orderdetails/',order._id]"
                            class="px-3 py-1 text-sm text-white transition bg-blue-600 rounded hover:bg-blue-700">
                            Details
                        </button>
                        <button
                        (click)="deleteOrder(order._id)"
                            class="px-3 py-1 text-sm text-white transition bg-red-600 rounded hover:bg-red-700">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Cards for Mobile -->
    <div class="grid gap-4 md:hidden">
        <div *ngFor="let order of orders" class="p-4 bg-gray-900 border border-gray-700 rounded-lg shadow"  [ngClass]="{'bg-green-800':order.orderStatus=='completed','hover:bg-green-700':order.orderStatus=='completed' , 'bg-red-900':order.orderStatus==='cancelled', 'hover:bg-red-800':order.orderStatus==='cancelled' , 'bg-slate-950':order.orderStatus==='pending','hover:bg-slate-800':order.orderStatus==='pending'}">
                    <h3 class="text-lg font-semibold text-white">Name : <span class="text-gray-400">{{ order.username }}</span></h3>
                    <h3 class="text-lg font-semibold text-white">Phone : <span class="text-gray-400">{{ order.phone }}</span></h3>
                    <h3 class="text-lg font-semibold text-white">Price  : <span class="text-gray-400">{{ order.price }}</span></h3>
                    <h3 class="text-lg font-semibold text-white">Date: <span class="text-gray-400">{{ order.createdAt}}</span></h3>

            <div class="flex justify-start gap-4 mt-4">
                <button
                    class="px-3 py-1 text-sm text-white transition bg-blue-600 rounded hover:bg-blue-700">
                    Order Details <i class="fa-solid fa-pen ms-1"></i>
                </button>
                <button
                    class="px-3 py-1 text-sm text-white transition bg-red-600 rounded hover:bg-red-700">
                    Delete Order <i class="fa-solid fa-trash ms-1"></i>
                </button>
            </div>
        </div>
    </div>
</div>
