<div class="max-w-6xl p-6 mx-auto bg-gray-900 rounded-lg shadow-lg">
    <!-- Header -->
    <div class="flex flex-col items-center justify-between gap-4 mb-6 sm:flex-row">
        <h2 class="text-2xl font-bold text-white">Copons</h2>

        <div class="flex items-center w-full gap-3 sm:w-auto">
            <!-- Add Category -->
            <button routerLink="/dashboard/copons/addcopon" class="px-4 py-2 text-sm font-medium text-white transition bg-green-600 rounded-md hover:bg-green-700">
                + Add Copon
            </button>
        </div>
    </div>

    <!-- Table for Desktop -->
    <div class="hidden overflow-x-auto rounded-lg shadow md:block">
        <table class="min-w-full text-sm text-left text-gray-300 border border-gray-700 rounded-md bg-slate-950">
            <thead class="text-xs text-gray-400 uppercase bg-gray-800">
                <tr>
                    <th class="px-6 py-3">#</th>
                    <th class="px-6 py-3">Code</th>
                    <th class="px-6 py-3">Value</th>
                    <th class="px-6 py-3 text-center">Usage Count</th>
                    <th class="px-6 py-3 text-center">Delete Copon</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let copon of copons let index=index" class="border-b border-gray-700 hover:bg-gray-800/70">
                    <td class="px-6 py-3">
                            {{index+1}}
                    </td>
                    <td class="px-6 py-3">{{ copon.code}}</td>
                    <td class="px-6 py-3 font-medium ">{{ copon.value }}</td>
                    <td class="px-6 py-3 text-center text-white">{{copon.usageCount}}</td>
                    <td class="px-6 py-3 text-center">
                        <button (click)="deleteCopon(copon._id)" class="px-3 py-1 text-sm text-white bg-red-600 rounded-md hover:bg-red-700">
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Cards for Mobile -->
    <div class="grid gap-4 md:hidden">
        <div *ngFor="let copon of copons"
             class="p-4 bg-gray-800 border border-gray-700 rounded-lg shadow">
            <div class="flex items-center gap-4">
                <div class="flex-1">
                    <h3 class="text-lg font-semibold text-white"> copon code : <span class="text-secondary_color">{{ copon.code }}</span></h3>
                    <h3 class="text-lg font-semibold text-white"> copon value : <span class=" text-secondary_color">{{ copon.value }}</span></h3>
                    <h3 class="text-lg font-semibold text-white">copon usageCount : <span class="text-secondary_color">{{ copon.usageCount }}</span></h3>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button  (click)="deleteCopon(copon._id)"  class="px-3 py-1 text-sm text-white bg-red-600 rounded hover:bg-red-700">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>
