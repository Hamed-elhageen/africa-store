<div class="max-w-3xl p-6 mx-auto border-gray-700 rounded-lg shadow-lg bg-slate-950">
    <!-- Title -->
    <h2 class="mb-6 text-2xl font-bold text-white">Add New Promo Code</h2>

    <!-- Form -->
    <form [formGroup]="promoCodeForm" (ngSubmit)="createPromoCode()"  class="space-y-6">
        <!-- Category Name -->
        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Enter the Promo code :</label>
            <input type="text"
                formControlName="promoCode"
                placeholder="Enter PromoCode"
                class="w-full px-4 py-2 text-white placeholder-gray-500 bg-gray-800 border border-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>


        <div>
            <label class="block mb-2 text-sm font-medium text-gray-300">Enter the discount percentage :</label>
            <input type="number"
                formControlName="discountPercentage"
                placeholder="Enter Discount Percentage"
                class="w-full px-4 py-2 text-white placeholder-gray-500 bg-gray-800 border border-gray-700 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>



        <!-- Submit Button -->
        <div class="flex justify-end">
            <button type="submit"
                    class="px-6 py-2 text-white transition bg-green-600 rounded-md hover:bg-green-700">
                <i class="mr-2 fa-solid fa-plus"></i>
                Add PromoCode
            </button>
        </div>
    </form>
</div>
