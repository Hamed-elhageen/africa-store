<div class="container mb-20 text-white" id="Sports shirts">
    <div class="flex items-center justify-between heading">
        <h3 class="mb-10">sports T-shirts</h3>
        <button [routerLink]="['/home/categoryproducts',categoryId]" class="z-10 flex justify-between bg-transparent md:bg-main_color hover:bg-green-700 duration-300  text-white md:px-10 px-5 py-2 mb-8  border rounded-lg w-fit border-main_color ">Show All <img src="arrow-up-right.svg" alt="arrow image" /></button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-[repeat(auto-fill,minmax(275px,1fr))] justify-between gap-x-5 gap-y-8 mx-auto">
    @for (item of products; track $index) {
        <app-card
            [productImage]="item.productImage"
            [title]="item.title"
            [discription]="item.discription"
            [price]="item.price"
            [priceBeforediscount]="item.priceBeforediscount"
    ></app-card>
    }


    </div>
</div>
