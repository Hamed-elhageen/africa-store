<div *ngIf="bannerDetails" class="relative mb-12  neymar  md:bg-[bottom_20%] "  [style.--bg-url]="'url(' + imageUrl + ')'">
    <div class="absolute top-0 left-0 block w-full h-full md:hidden  bg-gradient-to-b from-[#00000000] via-[#000000d6] to-[#000000d8] z-10"></div>
    <div class="container text-center md:text-left ">
        <div class="text-white absolute bottom-6 md:top-[50%] md:translate-y-[-50%] md:px-6 ps-0 pe-6 z-10    ">
            <h2  class="mb-3 text-secondary_color md:mb-7">{{bannerDetails.title}}</h2>
            <h1 class="text-[38px] md-[text-80px] mb-5 md:mb-10">{{bannerDetails.club}}</h1>
            <h4 id="typeit" class="w-full mb-5 md:w-[50%] md:mb-10">  {{bannerDetails.description}}<span class="text-secondary_color"> {{bannerDetails.season}}</span></h4>
            <h4 id="typeit" class="text-secondary_color "> </h4>
            <button [routerLink]="['/details/maindetails',bannerDetails.product ]" class="z-30 flex justify-center w-full gap-1 px-10 py-4 mb-8 duration-300 rounded-lg bg-main_color md:w-fit hover:bg-green-700"> Order now <img src="arrow-up-right.webp" alt="arrow image" /></button>
        </div>
    </div>
</div>
